name: Comms

# The scheduler, and deliberately not Vercel Cron.
#
# `vercel.json` carried a five-minute cron until the deploy refused it: the Hobby plan allows one
# run per *day*, and a dues reminder that goes out up to 24 hours after a board asks for it is not a
# product. The alternative was a paid plan, which is the wrong trade for something at 0/3 signatures
# with a $300 season price (PRD §11) -- so the schedule moved to the substrate this repo already
# runs CI on, where it is free and has no plan to outgrow.
#
# The route does not know or care: it is an HTTP GET with a bearer token, so swapping the caller is
# a workflow file rather than a change to the product.
on:
  schedule:
    # Every five minutes. GitHub's scheduler is best-effort and can run late under load, which is
    # fine for a reminder and would not be for a comp-day push -- G5 will need this revisited.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# A tick that overlaps its predecessor would claim nothing (the guarded UPDATE refuses it), but
# queueing rather than racing keeps the logs readable.
concurrency:
  group: comms-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send what is due
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # **An absence is a caveat; a contradiction is a hazard** -- #31's rule, applied to the
          # scheduler that runs more often than anything else in this repo.
          #
          # This errored when its secrets were unset, on the argument that a scheduler reporting
          # success while making no request is a lie. That argument is right about *silence* and
          # wrong about *severity*: comms is deliberately unconfigured on production, so the
          # condition is permanent, and a job that fires every five minutes turned it into 42 red
          # runs out of the last 100. A signal that is always on carries no information -- the next
          # real failure here arrives into a feed nobody reads, which is the defect this repo keeps
          # recording, wearing a different colour.
          #
          # So an unset secret is a **notice** and exit 0: the state is already reported, by name,
          # on the two instruments whose subject is the deployment -- `/api/health` and
          # `db:doctor --host`. Being *configured* and failing to sweep is the contradiction, and
          # that still fails loudly below.
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::comms is not configured (PRODUCTION_URL or CRON_SECRET unset) — nothing was swept. db:doctor --host reports this too."
            exit 0
          fi
          code=$(curl -sS -o /tmp/sweep.json -w "%{http_code}" \
            -H "authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/send")
          cat /tmp/sweep.json
          echo
          # 503 is the host saying *I have no sending credential*, which is the same caveat one
          # layer in: the secrets are set here and not there. Reported, not failed.
          if [ "$code" = "503" ]; then
            echo "::notice::$BASE_URL has no sending credential yet, so nothing was swept."
            exit 0
          fi
          # Anything else is a configured scheduler that could not sweep a configured host. That is
          # the contradiction, and it is worth waking somebody for.
          [ "$code" = "200" ] || { echo "::error::sweep of $BASE_URL returned $code"; exit 1; }
