name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A hand crank, because on Aug 6 there was none. Actions stopped scheduling for this repo for
  # several hours; the run for a pushed commit was never created, and once Actions recovered
  # nothing retried it -- so a PR sat reading CLEAN with no `check` or `acceptance` on it at all,
  # which is worse than reading red. Re-running a workflow needs a trigger that a person can pull.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # A cap, because there was none and it cost two hours. A hung step does not fail -- it runs to
    # the platform default of six hours, burning minutes the whole way, and reports nothing anybody
    # can act on. Every job here now says how long it is allowed to be worth waiting for.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The tabulation core is pure, so these need no database.
      # `reproducibility.test.ts` is the one that must never be weakened.
      - name: Unit tests
        run: bun run test

      # Typecheck does not compile the app. An RSC boundary violation or a server action that
      # cannot be serialized passes `tsc` and fails at deploy — which is to say, it fails on the
      # deployed demo, silently, until somebody opens it in front of a prospect.
      - name: Build
        run: bun run build
        env:
          # `next build` imports modules that read this at load. It never connects: no page here
          # is statically rendered, every route that touches data is `force-dynamic`.
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  # The acceptance test in PRD §8.3 needs a real Postgres and a real browser.
  #
  # It reads its own secret. `bun run e2e` reseeds, which deletes the demo org and everything
  # cascading from it, so the deployed demo's connection string must never be reachable from
  # this job. `e2e/guard.ts` refuses that database besides.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # **Not on a merge to `main`.** A PR's head is what gets squashed, so the push to `main` tests a
    # tree that was green minutes earlier -- and this job is the expensive one, holding the single CI
    # database for a quarter of an hour. Running it twice per change doubled the cost of every merge
    # and bought nothing: if a squash could change behaviour, `check` still runs here and would say
    # so. Drift against production is a different question and `migrations.yml` is what asks it.
    if: github.event_name != 'push'
    # One CI database, so one run at a time. Queue rather than cancel: a half-migrated
    # database is worse than a slow pipeline.
    concurrency:
      group: acceptance-database
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      # Where the `webServer` in `playwright.config.ts` puts the app. Not a secret, and not
      # optional: an announcement's opt-out link is built from this at enqueue, so without it
      # `unsubscribeUrl` is null by design and the one spec that walks a captain out of a
      # broadcast fails on an empty string. Locally this comes from `.env.local`, which is why
      # the suite passed on a laptop and failed here.
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::CI_DATABASE_URL is not set, so the PRD §8.3 acceptance test cannot run. A green check here would be a lie."
          exit 1

      # Chromium is ~130MB and the apt half of `--with-deps` reaches a mirror. Uncached, this step
      # downloaded both on every run, and once **hung for two hours** without failing -- the single
      # longest thing this repo has ever spent runner minutes on. Cached, a hit is seconds; the key
      # is the lockfile, because that is what pins the Playwright version the browser must match.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      # The browser binary caches; the system libraries it links against do not, so they are
      # installed on a hit too. Cheap, and skipping it is how a cached run dies on a missing .so.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - run: bun run db:migrate
      - run: bun run e2e
